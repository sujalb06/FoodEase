<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodEase - Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="dashboard-header">
        <div class="dashboard-logo">🍴 FoodEase</div>

        <div class="user-header">
            <span id="admin-name">Admin</span>
            <button class="header-btn logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <main class="admin-dashboard">

        <section class="welcome-section">
            <h1>Admin Dashboard</h1>
            <p>Manage all customer orders.</p>
        </section>

        <section class="admin-orders-section">
            <div class="admin-section-header">
                <h2>All Orders</h2>

                <button class="clear-orders-btn" onclick="clearAllOrders()">
                    Clear All Orders
                </button>
            </div>

            <div id="admin-orders-container">
                <!-- Orders will appear here -->
            </div>
        </section>

    </main>

    <script src="js/admin.js"></script>

</body>
</html>
