<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodEase - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                Food<span>Ease</span>
            </div>

            <p class="subtitle">
                Online Canteen Management System
            </p>


            <!-- Role Selection -->

            <div class="role-selection">

                <button
                    type="button"
                    class="role-btn active"
                    id="user-role"
                    onclick="selectRole('user')"
                >
                    User
                </button>

                <button
                    type="button"
                    class="role-btn"
                    id="admin-role"
                    onclick="selectRole('admin')"
                >
                    Admin
                </button>

            </div>


            <!-- Login Form -->

            <form id="login-form">

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <p id="login-error" class="login-error"></p>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>
</html>
